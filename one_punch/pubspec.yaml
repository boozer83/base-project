name: one_punch_run
description: "One Punch Run - Endless runner timing action game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Game Engine
  flame: ^1.20.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  hive_flutter: ^1.1.0

  # Utils
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

  # Audio
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  image: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/

  fonts:
    - family: GameFont
      fonts:
        - asset: assets/fonts/PressStart2P.ttf
